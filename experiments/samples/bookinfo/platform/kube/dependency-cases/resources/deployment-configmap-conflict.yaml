apiVersion: apps/v1
kind: Deployment
metadata:
  name: case-deployment-configmap-conflict
spec:
  selector:
    matchLabels:
      case: deployment-configmap-conflict
  template:
    metadata:
      labels:
        case: deployment-configmap-conflict
    spec:
      containers:
      - name: sleeper
        image: busybox:1.36.1
        command: ["sh", "-c", "sleep 3600"]
        envFrom:
        - configMapRef:
            name: bookinfo-service-config-conflict
