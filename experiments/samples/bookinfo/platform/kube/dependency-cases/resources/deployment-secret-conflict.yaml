apiVersion: apps/v1
kind: Deployment
metadata:
  name: case-deployment-secret-conflict
spec:
  selector:
    matchLabels:
      case: deployment-secret-conflict
  template:
    metadata:
      labels:
        case: deployment-secret-conflict
    spec:
      containers:
      - name: sleeper
        image: busybox:1.36.1
        command: ["sh", "-c", "sleep 3600"]
        env:
        - name: REVIEWS_HOSTNAME
          valueFrom:
            secretKeyRef:
              name: bookinfo-service-credentials-conflict
              key: REVIEWS_HOSTNAME
