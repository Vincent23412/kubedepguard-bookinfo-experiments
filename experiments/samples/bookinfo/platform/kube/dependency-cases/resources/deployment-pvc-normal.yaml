apiVersion: apps/v1
kind: Deployment
metadata:
  name: case-deployment-pvc-normal
spec:
  selector:
    matchLabels:
      case: deployment-pvc-normal
  template:
    metadata:
      labels:
        case: deployment-pvc-normal
    spec:
      containers:
      - name: sleeper
        image: busybox:1.36.1
        command: ["sh", "-c", "sleep 3600"]
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mongodb-data
