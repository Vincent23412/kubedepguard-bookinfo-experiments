# Runtime configuration and credentials consumed by Bookinfo Deployments.
# Productpage uses the Details and Reviews values; Reviews uses the Ratings
# values; Ratings uses the MongoDB connection string.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bookinfo-service-config
  labels:
    app: bookinfo
data:
  DETAILS_HOSTNAME: details
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: reviews-service-config
  labels:
    app: reviews
data:
  RATINGS_SERVICE_PORT: "9080"
---
apiVersion: v1
kind: Secret
metadata:
  name: bookinfo-service-credentials
  labels:
    app: bookinfo
type: Opaque
stringData:
  REVIEWS_HOSTNAME: reviews
---
apiVersion: v1
kind: Secret
metadata:
  name: reviews-service-credentials
  labels:
    app: reviews
type: Opaque
stringData:
  RATINGS_HOSTNAME: ratings
---
apiVersion: v1
kind: Secret
metadata:
  name: ratings-db-credentials
  labels:
    app: ratings
type: Opaque
stringData:
  MONGO_DB_URL: mongodb://mongodb:27017/test
